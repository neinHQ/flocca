name: Visibility checks
on:
  push:
    paths: ["products/visibility/**", ".github/workflows/visibility.yml"]
  pull_request:
    paths: ["products/visibility/**", ".github/workflows/visibility.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: visibility
          POSTGRES_PASSWORD: visibility_ci_only
          POSTGRES_DB: flocca_visibility_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U visibility -d flocca_visibility_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: products/visibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/visibility/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          VISIBILITY_TEST_DATABASE_URL: postgresql://visibility:visibility_ci_only@localhost:5432/flocca_visibility_test
          VISIBILITY_BROWSER_TESTS: "true"
          VISIBILITY_SCREENSHOT_DIR: test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visibility-browser-results
          path: products/visibility/test-results
          if-no-files-found: ignore
      - run: docker build --tag flocca-visibility:ci .
